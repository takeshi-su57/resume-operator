[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucky-resume"
version = "0.1.0"
description = "LuckyResume — local AI agent that tailors your resume to a job description"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "pymupdf>=1.24",
    "reportlab>=4.0",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "websockets>=13.0",
    "platformdirs>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "coverage>=7.0",
    "types-pyyaml>=6.0",
    "pyinstaller>=6.11",
]

[project.scripts]
lucky-resume = "lucky_resume.main:app"
lucky-resume-server = "lucky_resume.server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lucky_resume"]

[tool.hatch.build.targets.wheel.force-include]
# YAML data files don't get picked up by hatchling's default Python-only
# discovery, so include them explicitly. Path is package-relative under
# `lucky_resume.data.styles` to match `importlib.resources.files(...)`.
"src/lucky_resume/data/styles/default.yaml" = "lucky_resume/data/styles/default.yaml"
"src/lucky_resume/data/styles/consolas.yaml" = "lucky_resume/data/styles/consolas.yaml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "typer",
    "rich.*",
    "pydantic_settings",
    "langchain_core.*",
    "langchain_openai",
    "langchain_anthropic",
    "langchain_google_genai",
    "langgraph.*",
    "fitz",
    "fitz.*",
    "reportlab.*",
    "docx",
    "docx.*",
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lucky_resume.main"
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
